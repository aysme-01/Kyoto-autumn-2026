<section class="spots-page" aria-labelledby="spots-title">
    <h1 id="spots-title">京都のよりみち</h1>
    <div class="spots-filters" role="group" aria-label="スポットの分類">
        <button type="button" data-spot-filter="all" aria-pressed="true">すべて</button>
        <button type="button" data-spot-filter="arashiyama" aria-pressed="false">嵐山</button>
        <button type="button" data-spot-filter="higashiyama" aria-pressed="false">東山</button>
        <button type="button" data-spot-filter="food" aria-pressed="false">京の味</button>
        <button type="button" data-spot-filter="souvenir" aria-pressed="false">お土産</button>
    </div>
    <p id="spots-count" class="visually-hidden" role="status"></p>
    <div class="spots-grid" id="spots-grid"></div>
</section>
